name: CI (Toolchain)

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        liburing-version: [ "2.3", "2.14" ]
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
        generator: [ "Ninja", "Unix Makefiles" ]

    steps:
      - name: Checkout Repository and Submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout Liburing Version
        run: |
          cd ./third_party/liburing
          git fetch --tags
          git checkout liburing-${{ matrix.liburing-version }}
          cd ../../

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
              -G "${{ matrix.generator }}" \
              -DBUILD_EXAMPLES=ON \
              -DBUILD_BENCHMARKS=ON \
              -DBUILD_TESTS=ON \
              -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
              -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build ${{github.workspace}}/build -j$(nproc)

      - name: Run Tests
        timeout-minutes: 5
        working-directory: ${{github.workspace}}/build
        run: ctest --verbose
